[project]
name = "gatelog-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pymongo>=4.11,<5",
    "pydantic-settings>=2.8,<3",
    "numpy>=2.2,<3",
    "opencv-python-headless>=4.11,<5",
    "onnxruntime>=1.20,<2",
    "rapidocr_onnxruntime>=1.2.3,<2",
    "tzdata>=2025.1",
    "PyJWT[crypto]>=2.10,<3",
    "argon2-cffi>=23.1,<26",
    "beautifulsoup4>=4.13,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["mongodb: requires TEST_MONGODB_URI and a real MongoDB server"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
